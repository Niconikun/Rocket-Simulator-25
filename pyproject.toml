[build-system]
# =============================================================================
# Build System Configuration for Rocket Simulator Pro
# =============================================================================
#
# This file defines the build system requirements and configuration for
# Rocket Simulator Pro. It follows PEP 517 and PEP 518.
#
# Usage:
#   pip install .              # Install in development mode
#   pip install -e .           # Install in editable mode
#   python -m pip install .    # Install from local directory
#   pip wheel .                # Build a wheel
#
# =============================================================================

requires = [
    "setuptools>=61.0.0",
    "wheel>=0.37.0",
]
build-backend = "setuptools.build_meta"


[project]
# =============================================================================
# Project Metadata
# =============================================================================

name = "rocket-simulator-pro"
version = "2.0.4"
description = "6-DOF Rocket Trajectory Simulator with PyQt6 GUI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Rocket Simulator Team", email = ""},
    {name = "Jorge Orozco", email = ""},
]
maintainers = [
    {name = "Niconikun", email = ""},
]
keywords = [
    "rocket",
    "simulation",
    "6-DOF",
    "physics",
    "aerodynamics",
    "PyQt6",
    "trajectory",
    "monte-carlo",
    "space",
    "engineering",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

# Project URLs
dependencies = [
    # GUI Framework
    "PyQt6>=6.10.0",
    "PyQt6-Qt6>=6.10.2",
    "PyQt6-sip>=13.6.0",
    "PyQt6-WebEngine>=6.10.0",
    
    # Core Scientific Computing
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    
    # Visualization & Plotting
    "matplotlib>=3.8.0",
    "cartopy>=0.22.0",
    "pyqtgraph>=0.13.0",
    
    # Rocket Simulation Specific
    "navpy>=0.1.0",
    "fluids>=1.0.0",
    "ephem>=4.1.5",
    
    # Data Processing & Validation
    "jsonschema>=4.18.0",
    
    # Document Generation (Reports)
    "reportlab>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/Niconikun/Rocket-Simulator---GUI"
Documentation = "https://github.com/Niconikun/Rocket-Simulator---GUI#readme"
Repository = "https://github.com/Niconikun/Rocket-Simulator---GUI.git"
Issues = "https://github.com/Niconikun/Rocket-Simulator---GUI/issues"
Discussions = "https://github.com/Niconikun/Rocket-Simulator---GUI/discussions"
Changelog = "https://github.com/Niconikun/Rocket-Simulator---GUI/blob/pyqt-gui/CHANGELOG.md"

[project.scripts]
# Entry point for the application
rocket-simulator = "main:main"

[project.gui-scripts]
rocket-simulator-gui = "main:main"

[project.optional-dependencies]
# =============================================================================
# Optional Dependencies
# =============================================================================

# Development dependencies
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.1.0",
    
    # Code Quality
    "black>=24.0.0",
    "flake8>=6.1.0",
    "flake8-bugbear>=23.12.0",
    "mypy>=1.8.0",
    "pydocstyle>=6.3.0",
    "pre-commit>=3.6.0",
    
    # Type stubs
    "pandas-stubs>=2.0.0",
    "numpy-stubs>=1.24.0",
]

# Extended visualization
visualization = [
    "pyvista>=0.43.0",
    "plotly>=5.18.0",
    "folium>=0.15.0",
]

# STL import support
stl = ["trimesh>=4.0.0"]

# All optional dependencies
all = [
    "rocket-simulator-pro[dev]",
    "rocket-simulator-pro[visualization]",
    "rocket-simulator-pro[stl]",
]


[tool.setuptools]
# =============================================================================
# Setuptools Configuration
# =============================================================================

# Package directory structure
package-dir = {"" = "."}

# Include all Python packages
packages = [
    "src",
    "src.config",
    "src.models",
    "src.models.rocket",
    "src.models.engine",
    "src.models.engine.grains",
    "src.models.engine.mathlib",
    "src.utils",
    "models",
    "ui",
    "ui.widgets",
    "ui.components",
    "workers",
]

# Include non-Python files
package-data = {
    "": [
        "*.json",
        "*.yaml",
        "*.yml",
        "*.toml",
        "*.txt",
        "*.md",
        "*.csv",
        "*.ts",
        "*.qm",
        "*.ui",
        "*.qrc",
        "*.svg",
        "*.png",
        "*.ico",
    ],
    "data": ["**/*"],
    "ui": ["**/*"],
    "src": ["**/*"],
    "models": ["**/*"],
    "workers": ["**/*"],
}

# Exclude files
exclude-package-data = {
    "": [
        "__pycache__",
        "*.pyc",
        "*.pyo",
        "*.pyd",
        ".git",
        ".gitignore",
        ".venv",
        "venv",
        "build",
        "dist",
        "*.egg-info",
    ]
}

# Scripts to include
scripts = ["main.py", "build_exe.py", "add_aero_methods.py"]

# Entry points
entry-points = {
    "console_scripts": [
        "rocket-simulator = main:main",
        "rocket-sim-build = build_exe:main",
    ],
    "gui_scripts": [
        "rocket-simulator-gui = main:main",
    ],
}


[tool.setuptools.packages.find]
# Find packages automatically
where = [".", "src", "models", "ui", "workers"]
include = ["*"]
exclude = ["__pycache__", "*.tests", "*.test"]


[tool.black]
# =============================================================================
# Black Configuration
# =============================================================================

line-length = 120
target-version = ["py312", "py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | venv
    | build
    | dist
    | __pycache__
    | \.mypy_cache
    | \.pytest_cache
)/
'''


[tool.isort]
# =============================================================================
# isort Configuration
# =============================================================================

profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
]


[tool.flake8]
# =============================================================================
# Flake8 Configuration
# =============================================================================

max-line-length = 120
extend-exclude = [
    "__pycache__",
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
]
select = "E9,F63,F7,F82,B,C4,E,W"
ignore = [
    "E203",  # Whitespace before ':' (conflicts with Black)
    "W503",  # Line break before binary operator (conflicts with Black)
]
max-complexity = 10
count = true
show-source = true
statistics = true


[tool.mypy]
# =============================================================================
# mypy Configuration
# =============================================================================

python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
warn_return_any = true
warn_unused = true

# Ignore missing imports for third-party libraries
ignore_missing_imports = true

# Exclude patterns
exclude = [
    "build",
    "dist",
    "__pycache__",
    ".venv",
    "venv",
]

# Follow imports
follow_imports = "normal"


[tool.pytest.ini_options]
# =============================================================================
# Pytest Configuration
# =============================================================================

python_files = ["test_*.py", "*_test.py", "tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --color=yes"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: unit tests",
    "integration: integration tests",
    "ui: UI tests",
    "monte_carlo: Monte Carlo simulation tests",
    "aerodynamics: aerodynamics tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::RuntimeWarning",
]


[tool.pydocstyle]
# =============================================================================
# pydocstyle Configuration
# =============================================================================

convention = "google"
add_ignore = ["D100", "D104", "D105", "D107", "D202", "D212", "D400", "D401", "D413", "D415", "D417"]
match = "^(?!.*(test_|__)).*\.py$"
match-dir = "^(?!.*(tests|__pycache__)).*$"


[tool.coverage.run]
# =============================================================================
# Coverage Configuration
# =============================================================================

source = ["src", "models", "ui", "workers"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/conftest.py",
    "setup.py",
    "version.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
exclude_also = [
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]


[tool.bandit]
# =============================================================================
# Bandit Configuration (Security Linter)
# =============================================================================

exclude_dirs = [".git", ".venv", "venv", "build", "dist", "__pycache__"]
skips = ["B101"]  # Skip assert statements (we use them in tests)
