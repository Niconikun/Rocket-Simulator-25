name: Build & Release EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller>=6.0.0
      
      - name: Build executable
        run: |
          python build_exe.py
      
      - name: Verify executable exists
        run: |
          if (!(Test-Path "dist\RocketSimulator\RocketSimulator.exe")) {
            Write-Host "ERROR: Executable not found!"
            Get-ChildItem -Path "dist" -Recurse
            exit 1
          }
          Write-Host "SUCCESS: Executable created"
          $size = (Get-Item "dist\RocketSimulator\RocketSimulator.exe").Length / 1MB
          Write-Host "File size: $($size.ToString('F2')) MB"
      
      - name: Create distribution archive
        run: |
          Compress-Archive -Path "dist\RocketSimulator" -DestinationPath "RocketSimulator-windows.zip"
          Write-Host "Archive created successfully"
      
      - name: Get version
        id: get_version
        run: |
          $version = "${{ github.ref }}".Replace("refs/tags/v", "")
          if ($version -eq "") {
            $version = "${{ github.event.inputs.version }}"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"
      
      - name: Create Release
        uses: actions/create-release@v1
        id: create_release
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          release_name: Rocket Simulator v${{ steps.get_version.outputs.version }}
          body: |
            ## Rocket Simulator Pro v${{ steps.get_version.outputs.version }}
            
            ### What's New
            - Windows executable (.exe) for standalone deployment
            - All dependencies bundled
            
            ### Installation
            1. Download `RocketSimulator-windows.zip`
            2. Extract the archive
            3. Run `RocketSimulator.exe`
            
            ### Requirements
            - Windows 7 or later
            - No Python installation needed
            
            ### Contents
            - `RocketSimulator.exe` - Main application
            - Supporting libraries and data files
            - `README.md` and `LICENSE`
            
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload EXE to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/RocketSimulator/RocketSimulator.exe
          asset_name: RocketSimulator.exe
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload ZIP archive to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./RocketSimulator-windows.zip
          asset_name: RocketSimulator-windows.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Cleanup
        if: always()
        run: |
          Remove-Item -Path "dist", "build" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Cleanup completed"

  notify:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Release Summary
        run: |
          echo "✅ Release v${{ needs.build.outputs.version }} created successfully!"
          echo "📦 Files uploaded to GitHub Releases"
          echo "🎉 Ready for distribution"
