name: rocket-simulator-gui
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pyqt6=6.10.0
  - pyqt6-sip
  - numpy
  - scipy
  - pandas
  - matplotlib
  - ephem
  - folium>=0.14.0
  - plotly
  - pyvista
  - pyopengl
  - reportlab>=4.0.0
  - jsonschema
  - pyinstaller>=6.0.0
  - fluids
  - pip
pip:
      - navpy
      - pyqt6-webengine==6.10.0
      # Si algún paquete no está en conda-forge, se instalará por pip
      # - fluids
      # - ephem
